version: '3.8'

services:
  amr-guardian-enterprise:
    build: .
    container_name: amr-guardian-enterprise
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=amr-guardian-enterprise-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
